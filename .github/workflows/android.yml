name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      GODOT_VERSION: '4.4.1'
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            wget -q 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip' -O /tmp/cmdline-tools.zip
            mkdir -p "$RUNNER_TEMP/android-cmdline" "$ANDROID_HOME/cmdline-tools/latest"
            unzip -q /tmp/cmdline-tools.zip -d "$RUNNER_TEMP/android-cmdline"
            cp -a "$RUNNER_TEMP/android-cmdline/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' \
            'platforms;android-34' 'build-tools;34.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Instalar Godot y plantillas
        shell: bash
        run: |
          set -euo pipefail
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -qo /tmp/godot.zip -d /tmp
          chmod +x "/tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "/tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/export_templates.tpz
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -qo /tmp/export_templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --headless --version

      - name: Crear firma de depuracion
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Blue Dash,C=US'
          test -s "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"

      - name: Importar recursos y crear preferencias de Godot
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit

      - name: Configurar Android SDK JDK y firma en Godot 4.4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          # Godot 4.4 usa editor_settings-4.4.tres, NO editor_settings-4.tres.
          settings = Path.home() / '.config/godot/editor_settings-4.4.tres'
          if not settings.exists():
              raise SystemExit(f'Godot no genero las preferencias: {settings}')
          data = settings.read_text()
          if '[resource]' not in data:
              raise SystemExit(f'Preferencias invalidas: {settings}')

          def update_tres(text, key, value):
              line = f'{key} = "{value}"'
              pattern = rf'(?m)^{re.escape(key)}\s*=.*$'
              if re.search(pattern, text):
                  return re.sub(pattern, lambda _: line, text)
              return text.rstrip() + '\n' + line + '\n'

          data = update_tres(data, 'export/android/android_sdk_path', os.environ['ANDROID_HOME'])
          data = update_tres(data, 'export/android/java_sdk_path', os.environ['JAVA_HOME'])
          settings.write_text(data)
          print('Editor settings:', settings)
          print('Android SDK:', os.environ['ANDROID_HOME'])
          print('Java SDK:', os.environ['JAVA_HOME'])

          preset_path = Path('export_presets.cfg')
          preset = preset_path.read_text()
          if 'name="Android"' not in preset or '[preset.0.options]' not in preset:
              raise SystemExit('No existe el preset Android esperado')
          # Modificamos solamente la seccion de opciones del preset Android.
          updates = {
              'keystore/debug': '"' + os.environ['GODOT_ANDROID_KEYSTORE_DEBUG_PATH'] + '"',
              'keystore/debug_user': '"androiddebugkey"',
              'keystore/debug_password': '"android"',
              'package/signed': 'true',
          }
          for key, value in updates.items():
              line = f'{key}={value}'
              pattern = rf'(?m)^{re.escape(key)}=.*$'
              if re.search(pattern, preset):
                  preset = re.sub(pattern, lambda _: line, preset)
              else:
                  preset = preset.rstrip() + '\n' + line + '\n'
          preset_path.write_text(preset)
          print('Preset de Android y clave debug configurados')
          PY
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -s "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"

      - name: Exportar APK con diagnostico
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --verbose --path . --export-debug Android build/BlueDash.apk 2>&1 | tee build/export.log
          test -s build/BlueDash.apk
          ls -lh build/BlueDash.apk

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlueDash-Android-APK
          path: build/BlueDash.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar diagnostico si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BlueDash-Logs-Android
          path: build/export.log
          if-no-files-found: ignore
          retention-days: 7
