name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      GODOT_VERSION: '4.4.1'
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)
          if [ -z "$SDKMANAGER" ]; then
            wget -q 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip' -O /tmp/cmdline-tools.zip
            mkdir -p "$RUNNER_TEMP/android-cmdline" "$ANDROID_HOME/cmdline-tools/latest"
            unzip -q /tmp/cmdline-tools.zip -d "$RUNNER_TEMP/android-cmdline"
            cp -a "$RUNNER_TEMP/android-cmdline/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Descargar Godot 4.4.1
        shell: bash
        run: |
          set -e
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --headless --version

      - name: Instalar plantillas de exportacion
        shell: bash
        run: |
          set -e
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/export_templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/export_templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Crear clave Android Debug
        shell: bash
        run: |
          keytool -genkeypair -noprompt -v \
            -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Blue Dash,C=US'

      - name: Importar proyecto Godot
        shell: bash
        run: |
          set -e
          godot --headless --path . --editor --import --quit

      - name: Configurar SDK y JDK en Godot
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import os
          from pathlib import Path

          settings = Path.home() / '.config/godot/editor_settings-4.tres'
          settings.parent.mkdir(parents=True, exist_ok=True)
          data = settings.read_text() if settings.exists() else '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
          if '[resource]' not in data:
              raise SystemExit(f'No se encuentra [resource] en {settings}')
          import re
          for key, value in {
              'export/android/android_sdk_path': os.environ['ANDROID_HOME'],
              'export/android/java_sdk_path': os.environ['JAVA_HOME'],
          }.items():
              line = f'{key} = "{value}"'
              if re.search(rf'(?m)^{re.escape(key)}\s*=', data):
                  data = re.sub(rf'(?m)^{re.escape(key)}\s*=.*$', lambda _: line, data)
              else:
                  data = data.rstrip() + '\n' + line + '\n'
          settings.write_text(data)
          print('Godot Android SDK:', os.environ['ANDROID_HOME'])
          print('Godot Java SDK:', os.environ['JAVA_HOME'])
          print('Editor settings:', settings)
          PY
          test -f export_presets.cfg

      - name: Compilar APK Android
        shell: bash
        run: |
          set -e
          mkdir -p build
          godot --headless --path . --export-debug 'Android' build/BlueDash.apk
          test -s build/BlueDash.apk
          ls -lh build/BlueDash.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueDash-Android-APK
          path: build/BlueDash.apk
          if-no-files-found: error
          retention-days: 30
