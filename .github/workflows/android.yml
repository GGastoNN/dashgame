name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      GODOT_VERSION: '4.4.1'
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            wget -q 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip' -O "$RUNNER_TEMP/cmdline-tools.zip"
            mkdir -p "$RUNNER_TEMP/android-tools" "$ANDROID_HOME/cmdline-tools/latest"
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/android-tools"
            cp -a "$RUNNER_TEMP/android-tools/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' \
            'platforms;android-34' 'build-tools;34.0.0' \
            'cmake;3.10.2.4988404' 'ndk;23.2.8568313'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Instalar Godot y plantillas
        shell: bash
        run: |
          set -euo pipefail
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O "$RUNNER_TEMP/godot.zip"
          unzip -qo "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -qo "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -a "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          test -s "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk"
          godot --headless --version

      - name: Crear keystore debug
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Blue Dash,C=US'

      - name: Importar recursos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --editor --import --quit 2>&1 | tee build/import.log

      - name: Configurar preferencias y preset Android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          settings = Path.home() / '.config/godot/editor_settings-4.4.tres'
          if not settings.is_file():
              raise SystemExit(f'No existe configuracion de Godot: {settings}')
          data = settings.read_text()
          if '[resource]' not in data:
              raise SystemExit('Las preferencias de Godot no tienen la seccion [resource]')

          # Insertar las propiedades dentro de [resource].
          for key, value in {
              'export/android/android_sdk_path': os.environ['ANDROID_HOME'],
              'export/android/java_sdk_path': os.environ['JAVA_HOME'],
          }.items():
              data = re.sub(rf'(?m)^{re.escape(key)}\s*=.*(?:\n|$)', '', data)
              data = data.replace('[resource]\n', f'[resource]\n{key} = "{value}"\n', 1)
          settings.write_text(data)

          preset_file = Path('export_presets.cfg')
          preset = preset_file.read_text()
          if 'name="Android"' not in preset or '[preset.0.options]' not in preset:
              raise SystemExit('No se encontro el preset Android')
          updates = {
              'keystore/debug': os.environ['GODOT_ANDROID_KEYSTORE_DEBUG_PATH'],
              'keystore/debug_user': 'androiddebugkey',
              'keystore/debug_password': 'android',
          }
          # Ajustar exclusivamente la seccion de opciones del preset 0.
          head, options = preset.split('[preset.0.options]', 1)
          for key, value in updates.items():
              line = f'{key}="{value}"'
              pattern = rf'(?m)^{re.escape(key)}\s*=.*$'
              if re.search(pattern, options):
                  options = re.sub(pattern, lambda _: line, options)
              else:
                  options = options.rstrip() + '\n' + line + '\n'
          preset_file.write_text(head + '[preset.0.options]' + options)
          print('SDK:', os.environ['ANDROID_HOME'])
          print('JDK:', os.environ['JAVA_HOME'])
          print('Editor:', settings)
          print('Preset: export_presets.cfg')
          PY

      - name: Registrar diagnostico de configuracion
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== GODOT ==='
            godot --headless --version
            echo '=== ANDROID Y JAVA ==='
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "JAVA_HOME=$JAVA_HOME"
            ls -l "$ANDROID_HOME/platform-tools/adb" "$ANDROID_HOME/build-tools/35.0.0/aapt2"
            ls -l "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk"
            echo '=== PREFERENCIAS RELEVANTES ==='
            grep -E '^export/android/(android_sdk_path|java_sdk_path)' "$HOME/.config/godot/editor_settings-4.4.tres" || true
            echo '=== OPCIONES DEL PRESET (sin contrasenas) ==='
            grep -E '^(name|platform|package/unique_name|package/signed|keystore/debug_user|gradle_build/use_gradle_build)=' export_presets.cfg || true
            echo '=== OTRAS HERRAMIENTAS ==='
            find "$ANDROID_HOME" -maxdepth 4 -name apksigner -o -name zipalign | head -20
          } 2>&1 | tee build/config-diagnostic.log

      - name: Exportar APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --verbose --path . --export-debug Android build/BlueDash.apk 2>&1 | tee build/export.log
          test -s build/BlueDash.apk
          ls -lh build/BlueDash.apk

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlueDash-Android-APK
          path: build/BlueDash.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar diagnosticos si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BlueDash-Diagnosticos
          path: |
            build/import.log
            build/config-diagnostic.log
            build/export.log
          if-no-files-found: warn
          retention-days: 7
