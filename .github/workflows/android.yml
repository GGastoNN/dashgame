name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      GODOT_VERSION: '4.4.1'
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK completo
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            wget -q 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip' -O "$RUNNER_TEMP/cmdline-tools.zip"
            mkdir -p "$RUNNER_TEMP/android-tools" "$ANDROID_HOME/cmdline-tools/latest"
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/android-tools"
            cp -a "$RUNNER_TEMP/android-tools/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' \
            'platforms;android-35' 'build-tools;35.0.0' \
            'cmake;3.10.2.4988404' 'ndk;23.2.8568313'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -f "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"

      - name: Instalar Godot y plantillas
        shell: bash
        run: |
          set -euo pipefail
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O "$RUNNER_TEMP/godot.zip"
          unzip -qo "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -qo "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -a "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          test -s "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk"
          godot --headless --version

      - name: Crear firma debug
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Blue Dash,C=US'

      - name: Importar recursos Godot
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit

      - name: Configurar exportacion de Godot 4.4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          settings = Path.home() / '.config/godot/editor_settings-4.4.tres'
          if not settings.exists():
              raise SystemExit(f'Godot no creo el archivo: {settings}')
          data = settings.read_text()
          if '[resource]' not in data:
              raise SystemExit('No existe seccion [resource] en las preferencias')

          # Escribir las rutas dentro de [resource], no al final del archivo.
          for key, value in {
              'export/android/android_sdk_path': os.environ['ANDROID_HOME'],
              'export/android/java_sdk_path': os.environ['JAVA_HOME'],
          }.items():
              data = re.sub(rf'(?m)^{re.escape(key)}\s*=.*\n?', '', data)
              data = data.replace('[resource]\n', f'[resource]\n{key} = "{value}"\n', 1)
          settings.write_text(data)
          print('Preferencias:', settings)
          for key in ('export/android/android_sdk_path', 'export/android/java_sdk_path'):
              print(next(line for line in data.splitlines() if line.startswith(key + ' =')))

          preset_path = Path('export_presets.cfg')
          preset = preset_path.read_text()
          if 'name="Android"' not in preset or '[preset.0.options]' not in preset:
              raise SystemExit('No se encuentra el preset Android')
          for key, value in {
              'keystore/debug': os.environ['GODOT_ANDROID_KEYSTORE_DEBUG_PATH'],
              'keystore/debug_user': 'androiddebugkey',
              'keystore/debug_password': 'android',
          }.items():
              line = f'{key}="{value}"'
              if re.search(rf'(?m)^{re.escape(key)}\s*=', preset):
                  preset = re.sub(rf'(?m)^{re.escape(key)}\s*=.*$', lambda _: line, preset)
              else:
                  preset += '\n' + line
          preset_path.write_text(preset)
          print('Preset Android configurado')
          PY

      - name: Exportar APK y registrar diagnostico
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          echo 'Verificando SDK, JDK y plantillas...'
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -s "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk"
          godot --headless --verbose --path . --export-debug Android build/BlueDash.apk 2>&1 | tee build/export.log
          test -s build/BlueDash.apk
          ls -lh build/BlueDash.apk

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlueDash-Android-APK
          path: build/BlueDash.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar diagnostico al fallar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BlueDash-Logs-Android
          path: build/export.log
          if-no-files-found: ignore
          retention-days: 7
